# Conda environment for the Hidden Object Game.
#
# From the folder that contains this file and requirements.txt:
#     conda env create -f environment.yml
#     conda activate sam3-objects
#
# NVIDIA GPU? Install the CUDA build of PyTorch from pytorch.org into the new environment,
# then run:  pip install -r requirements.txt   (see the notes in requirements.txt)
name: sam3-objects
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
